function escapeHtml(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function anim(id, target, ms) {
  const el = document.getElementById(id);
  if (!el) return;
  const startVal = parseInt(el.textContent.replace(/,/g, ''), 10) || 0;
  const s = performance.now();
  function step(n) {
    const p = Math.min((n - s) / ms, 1);
    const e = 1 - Math.pow(1 - p, 3);
    const current = Math.round(startVal + (target - startVal) * e);
    el.textContent = current.toLocaleString();
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

  let totalAssets = 0;
  cards.forEach(c => {
    if (c.rawFootage && c.rawFootage.trim()) totalAssets++;
    if (c.editedDraft && c.editedDraft.trim()) totalAssets++;
    if (c.supporting && c.supporting.trim()) totalAssets++;
    if (c.postedUrl && c.postedUrl.trim()) totalAssets++;
  });

  // Animate Top Stat Numbers
  anim('s0', totalContent, 700);
  anim('s1', activePipeline, 700);
  anim('s2', postedCount, 700);
  anim('s3', ideasCount, 700);
  anim('s4', totalAssets, 700);

  // ── Render BY CONTENT TYPE ──
  const platformCounts = {};
  Object.keys(PLATFORM_CONFIG).forEach(p => platformCounts[p] = 0);
  cards.forEach(c => {
    const p = c.platform || 'IG Reel';
    if (platformCounts[p] !== undefined) {
      platformCounts[p]++;
    } else {
      platformCounts[p] = 1;
    }
  });

  const maxPlatformCount = Math.max(...Object.values(platformCounts), 1);
  const barListEl = document.getElementById('bar-list');
  if (barListEl) {
    barListEl.innerHTML = '';
    Object.keys(platformCounts).forEach((pName, idx) => {
      const count = platformCounts[pName] || 0;
      const pct = Math.round((count / maxPlatformCount) * 100);
      const dotCls = (PLATFORM_CONFIG[pName] && PLATFORM_CONFIG[pName].dotCls) || 'ig-reel';
      
      const itemEl = document.createElement('div');
      itemEl.className = 'bar-item';
      itemEl.onclick = () => location.href = `board.html?filter=${encodeURIComponent(pName)}`;
      itemEl.innerHTML = `
        <div class="bar-label-row">
          <span class="p-dot ${dotCls}"></span>
          <span class="bar-name">${escapeHtml(pName)}</span>
          <span class="bar-count">${count}</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" data-w="${pct}"></div>
        </div>
      `;
      barListEl.appendChild(itemEl);
    });

    setTimeout(() => {
      document.querySelectorAll('.bar-fill').forEach((b, i) => {
        setTimeout(() => {
          b.style.width = (b.dataset.w || 0) + '%';
        }, i * 60);
      });
    }, 100);
  }

  // ── Render BY STATUS ──
  const statusCounts = {};
  STATUS_CONFIG.forEach(s => statusCounts[s.id] = 0);
  cards.forEach(c => {
    const col = c.colId || 'idea';
    if (statusCounts[col] !== undefined) {
      statusCounts[col]++;
    }
  });

  const statusListEl = document.getElementById('status-list');
  if (statusListEl) {
    statusListEl.innerHTML = '';
    STATUS_CONFIG.forEach(st => {
      const count = statusCounts[st.id] || 0;
      const row = document.createElement('div');
      row.className = 'status-row';
      row.onclick = () => location.href = `board.html?status=${st.id}`;
      row.innerHTML = `
        <span class="status-tag ${st.cls}">&#9679; ${st.label}</span>
        <span class="status-count">${count}</span>
      `;
      statusListEl.appendChild(row);
    });
  }

  // ── Render NEEDS REVIEW ──
  const reviewCards = cards.filter(c => c.colId === 'review');
  const reviewListEl = document.getElementById('review-list');
  if (reviewListEl) {
    reviewListEl.innerHTML = '';
    if (reviewCards.length === 0) {
      reviewListEl.innerHTML = '<div class="empty-schedule"><p>No content waiting for review 🎉</p></div>';
    } else {
      reviewCards.slice(0, 5).forEach(c => {
        const dotCls = (PLATFORM_CONFIG[c.platform] && PLATFORM_CONFIG[c.platform].dotCls) || 'ig-reel';
        const item = document.createElement('div');
        item.className = 'review-item';
        item.onclick = () => location.href = `board.html?card=${c.id}`;
        item.innerHTML = `
          <p class="review-title">${escapeHtml(c.title)}</p>
          <div class="review-tags">
            <span class="tag-platform"><span class="p-dot ${dotCls}" style="width:11px;height:11px;border-radius:2px"></span> ${escapeHtml(c.platform || 'IG Reel')}</span>
            <span class="tag-review-pill">&#9679; For Review</span>
          </div>
        `;
        reviewListEl.appendChild(item);
      });
    }
  }

  // ── Render UPCOMING SCHEDULE ──
  const scheduledCards = cards.filter(c => c.colId === 'scheduled' || (c.scheduledFor && c.scheduledFor.trim() !== ''));
  const scheduleContainerEl = document.getElementById('schedule-container');
  if (scheduleContainerEl) {
    scheduleContainerEl.innerHTML = '';
    if (scheduledCards.length === 0) {
      scheduleContainerEl.innerHTML = '<div class="empty-schedule"><p>No scheduled content yet.</p></div>';
    } else {
      const scheduleList = document.createElement('div');
      scheduleList.className = 'review-list';
      scheduledCards.slice(0, 5).forEach(c => {
        const dotCls = (PLATFORM_CONFIG[c.platform] && PLATFORM_CONFIG[c.platform].dotCls) || 'ig-reel';
        const dateStr = c.scheduledFor ? escapeHtml(c.scheduledFor) : 'Scheduled';
        const item = document.createElement('div');
        item.className = 'review-item';
        item.onclick = () => location.href = `board.html?card=${c.id}`;
        item.innerHTML = `
          <p class="review-title">${escapeHtml(c.title)}</p>
          <div class="review-tags">
            <span class="tag-platform"><span class="p-dot ${dotCls}" style="width:11px;height:11px;border-radius:2px"></span> ${escapeHtml(c.platform || 'IG Reel')}</span>
            <span class="tag-review-pill" style="background:#ecfdf5;color:#065f46;border-color:#a7f3d0">&#9679; ${dateStr}</span>
          </div>
        `;
        scheduleList.appendChild(item);
      });
      scheduleContainerEl.appendChild(scheduleList);
    }
  }
}

async function loadFromSupabase() {
  if (!sbClient) return;
  try {
    const { data, error } = await sbClient.from('emenu_store').select('key,value').eq('key', CLOUD_KEY).single();
    if (!error && data && Array.isArray(data.value)) {
      cards = data.value;
      localStorage.setItem('content_os_board_cards', JSON.stringify(cards));
      renderDashboard();
    }
  } catch(e) {}
}

function subscribeRealtime() {
  if (!sbClient) return;
  try {
    sbClient
      .channel('content_os_dash_sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'emenu_store' }, (payload) => {
        const row = payload.new;
        if (row && row.key === CLOUD_KEY && Array.isArray(row.value)) {
          cards = row.value;
          localStorage.setItem('content_os_board_cards', JSON.stringify(cards));
          renderDashboard();
        }
      })
      .subscribe();
  } catch(e) {}
}

function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ── Real-Time Sync on Storage or Window Focus ──
window.addEventListener('storage', (e) => {
  if (e.key === 'content_os_board_cards') {
    loadCards();
    renderDashboard();
  }
});

window.addEventListener('focus', () => {
  loadCards();
  renderDashboard();
  loadFromSupabase();
});

// ── INIT ──
initSupabase();
loadCards();
renderDashboard();
loadFromSupabase().then(() => {
  subscribeRealtime();
});
</script>
